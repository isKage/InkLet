<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <!--
    InkLet's mark: "IL" plus one grey stroke that turns the pair into a K.

    Source of truth for the app icon — regenerate the platform assets with

      node scripts/make-icon.mjs

    The same geometry is inlined as `#inklet-mark` in apps/desktop/index.html, so
    the icon in the title bar and the one in the Dock cannot drift apart.
    Everything here is a path, not text: no font is involved, so the render is
    identical on every machine.

    Draw order is the design:
      plate → L → (white keyline + grey stroke, clipped at the I) → I

    - the stroke starts inside the I and is clipped at x=208 (the I's right edge),
      so no round cap and no keyline can peek out on either side of the I;
    - the I is painted last, so the stroke's left end is simply covered by it;
    - the white keyline cuts the L on both sides of the stroke where they cross.
  -->
  <rect
    x="40"
    y="40"
    width="432"
    height="432"
    rx="92"
    fill="#fdfdfe"
    stroke="#e8e8ef"
    stroke-width="1.5"
  />

  <!-- L first: the keyline has to be able to cut it -->
  <path d="M238 185a17 17 0 0 1 34 0v123h63a13.5 13.5 0 0 1 0 27h-88a9 9 0 0 1-9-9z" fill="#17171b" />

  <!--
    The stroke, drawn twice: a white keyline under the grey band.
    Knobs:
      d                  M196 283 = starts inside the I, a little below its middle
                         320 185 = cap line (round cap top lands on 168)
      clip  x=208        the I's right edge: nothing is drawn over the I itself
      white stroke-width 48  = 34 grey + 7px of white on each side
      grey  stroke-opacity 0.7
  -->
  <clipPath id="past-the-i">
    <rect x="208" y="120" width="300" height="280" />
  </clipPath>

  <g clip-path="url(#past-the-i)">
    <path
      d="M196 283 320 185"
      fill="none"
      stroke="#fdfdfe"
      stroke-width="48"
      stroke-linecap="round"
    />
    <path
      d="M196 283 320 185"
      fill="none"
      stroke="#c8ccd4"
      stroke-opacity="0.7"
      stroke-width="34"
      stroke-linecap="round"
    />
  </g>

  <!-- I last: it hides the stroke's start, so the grey emerges from the letter -->
  <rect x="175" y="168" width="34" height="169" rx="17" fill="#17171b" />
</svg>
