[package]
name = "inklet"
version = "0.1.0"
description = "InkLet（墨点）— 面向学术写作的 Markdown 编辑器"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` lets the webview load a PDF straight from disk (see
# assetProtocol in tauri.conf.json).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

# Setting the Dock icon at runtime, which macOS otherwise takes from the .app
# bundle — and `tauri dev` runs a bare binary with no bundle at all.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
